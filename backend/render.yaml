services:
  - type: web
    name: autonomous-india-road
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,https://your-app.vercel.app
